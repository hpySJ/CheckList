<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제출 서류 체크리스트</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #f7f7f5;
    color: #37352f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px 80px;
  }

  .page { width: 100%; max-width: 560px; }

  .page-emoji { font-size: 40px; margin-bottom: 10px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #9b9a97; margin-bottom: 28px; }

  .progress-box {
    background: #f1f1ef;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .progress-wrap { flex: 1; }
  .progress-label { font-size: 12px; color: #9b9a97; margin-bottom: 6px; }
  .progress-track { height: 6px; background: #e9e9e7; border-radius: 99px; overflow: hidden; }
  .progress-bar {
    height: 100%; border-radius: 99px; background: #1B3A6B;
    transition: width 0.35s ease, background 0.3s; width: 0%;
  }
  .progress-pct { font-size: 20px; font-weight: 600; min-width: 46px; text-align: right; }

  .divider { border: none; border-top: 1px solid #e9e9e7; margin: 0 0 24px; }

  .section { margin-bottom: 32px; }
  .section-header {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 12px;
  }
  .section-title {
    display: flex; align-items: center;
    gap: 8px; font-size: 16px; font-weight: 600;
  }
  .badge {
    font-size: 12px; font-weight: 500;
    padding: 2px 10px; border-radius: 20px;
    background: #f1f1ef; color: #9b9a97;
    border: 1px solid #e9e9e7; transition: all 0.2s;
  }
  .section-items {
    padding-left: 12px;
    border-left: 2px solid transparent;
    transition: border-color 0.2s;
  }

  .check-item {
    display: flex; align-items: flex-start;
    gap: 10px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; margin-bottom: 2px;
    transition: background 0.12s; user-select: none;
  }
  .check-item:hover { background: #f7f6f3; }

  .checkbox {
    margin-top: 2px; width: 18px; height: 18px;
    border-radius: 4px; border: 1.5px solid #d3d2cf;
    background: transparent; display: flex;
    align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .checkbox svg { display: none; }
  .check-item.checked .checkbox svg { display: block; }

  .item-text { font-size: 14.5px; line-height: 1.4; color: #37352f; transition: all 0.15s; }
  .check-item.checked .item-text { color: #9b9a97; text-decoration: line-through; }
  .item-sub { font-size: 12px; color: #9b9a97; margin-top: 1px; }

  .done-banner {
    display: none; background: #ECFDF5;
    border: 1px solid rgba(6,95,70,0.2); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 20px;
    font-size: 14px; color: #065F46; font-weight: 500;
    align-items: center; gap: 8px;
  }
  .done-banner.show { display: flex; }

  .bottom-row { display: flex; align-items: center; justify-content: space-between; }
  .sync-status { font-size: 12px; color: #9b9a97; }
  .sync-status.saving { color: #dfab01; }
  .sync-status.saved  { color: #065F46; }
  .sync-status.error  { color: #e03e3e; }

  .reset-btn {
    font-size: 13px; padding: 6px 14px; color: #9b9a97;
    background: transparent; border: 1px solid #e9e9e7;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    transition: background 0.12s;
  }
  .reset-btn:hover { background: #f1f1ef; }
</style>
</head>
<body>
<div class="page">
  <div class="page-emoji">📋</div>
  <h1>제출 서류 체크리스트</h1>
  <p class="subtitle">알파프로젝트 · 4-1 참가비 · 4-2 교통비 · 4-3 숙박비</p>

  <div class="progress-box">
    <div class="progress-wrap">
      <div class="progress-label">전체 진행률</div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>

  <hr class="divider">
  <div id="sections"></div>

  <div class="done-banner" id="doneBanner">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M3 8l3.5 3.5 6.5-7" stroke="#065F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    모든 서류 준비 완료!
  </div>

  <div class="bottom-row">
    <span class="sync-status" id="syncStatus"></span>
    <button class="reset-btn" id="resetBtn">초기화</button>
  </div>
</div>

<script>
var SECTIONS = [
  {
    id: "s41", emoji: "🎫", label: "4-1  참가비",
    color: "#1B3A6B", lightColor: "#EFF6FF", borderColor: "rgba(27,58,107,0.25)",
    items: [
      { id: "s41_1", text: "학회 참가확인서",            sub: "활동 이후 발행분만 유효" },
      { id: "s41_2", text: "참가비 요금표",               sub: "" },
      { id: "s41_3", text: "거래명세서",                  sub: "" },
      { id: "s41_4", text: "활동 사진",                   sub: "" }
    ]
  },
  {
    id: "s42", emoji: "🚆", label: "4-2  교통비",
    color: "#065F46", lightColor: "#ECFDF5", borderColor: "rgba(6,95,70,0.25)",
    items: [
      { id: "s42_1", text: "활동 사진",   sub: "" },
      { id: "s42_2", text: "참가확인서",  sub: "활동 이후 발행분만 유효" }
    ]
  },
  {
    id: "s43", emoji: "🏨", label: "4-3  숙박비",
    color: "#4C1D95", lightColor: "#F5F3FF", borderColor: "rgba(76,29,149,0.25)",
    items: [
      { id: "s43_1", text: "거래명세서 또는 숙박확인서",  sub: "객실정보 · 인원 · 금액 확인 필수" },
      { id: "s43_2", text: "활동 사진",                   sub: "" },
      { id: "s43_3", text: "방별 숙박 인원 인증 사진",    sub: "방마다 어느 인원이 숙박했는지 확인 가능해야 함" }
    ]
  }
];

var ALL_IDS = [];
SECTIONS.forEach(function(s) { s.items.forEach(function(i) { ALL_IDS.push(i.id); }); });

var checks = {};

// ── API ──────────────────────────────────────────────
function setStatus(msg, cls) {
  var el = document.getElementById("syncStatus");
  el.textContent = msg;
  el.className = "sync-status " + (cls || "");
}

function apiLoad(cb) {
  fetch("/api/checks")
    .then(function(r) { return r.json(); })
    .then(function(data) { cb(data); })
    .catch(function() { setStatus("서버 연결 실패", "error"); });
}

function apiSave(id, checked) {
  setStatus("저장 중...", "saving");
  fetch("/api/checks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, checked: checked })
  })
  .then(function() { setStatus("저장됨", "saved"); setTimeout(function() { setStatus(""); }, 1500); })
  .catch(function() { setStatus("저장 실패", "error"); });
}

function apiReset(cb) {
  fetch("/api/checks", { method: "DELETE" })
    .then(function() { cb(); })
    .catch(function() { setStatus("초기화 실패", "error"); });
}

// ── UI ───────────────────────────────────────────────
function updateProgress() {
  var done = 0;
  ALL_IDS.forEach(function(id) { if (checks[id]) done++; });
  var pct = Math.round(done / ALL_IDS.length * 100);
  var bar = document.getElementById("progressBar");
  bar.style.width = pct + "%";
  bar.style.background = pct === 100 ? "#065F46" : "#1B3A6B";
  document.getElementById("progressPct").textContent = pct + "%";
  var banner = document.getElementById("doneBanner");
  if (pct === 100) banner.classList.add("show");
  else banner.classList.remove("show");
}

function updateSectionBadge(section) {
  var done = 0;
  section.items.forEach(function(i) { if (checks[i.id]) done++; });
  var allDone = done === section.items.length;
  var badge = document.getElementById("badge_" + section.id);
  badge.textContent = done + " / " + section.items.length;
  badge.style.background  = allDone ? section.lightColor   : "#f1f1ef";
  badge.style.color       = allDone ? section.color        : "#9b9a97";
  badge.style.borderColor = allDone ? section.borderColor  : "#e9e9e7";
  var bar = document.getElementById("sbar_" + section.id);
  bar.style.borderLeftColor = section.color + (allDone ? "" : "33");
}

function applyItemState(el, box, item, section) {
  if (checks[item.id]) {
    el.classList.add("checked");
    el.style.background  = section.lightColor;
    box.style.border     = "2px solid " + section.color;
    box.style.background = section.color;
  } else {
    el.classList.remove("checked");
    el.style.background  = "";
    box.style.border     = "1.5px solid #d3d2cf";
    box.style.background = "transparent";
  }
}

function renderSections() {
  var container = document.getElementById("sections");
  container.innerHTML = "";

  SECTIONS.forEach(function(section) {
    var sec = document.createElement("div");
    sec.className = "section";

    var header = document.createElement("div");
    header.className = "section-header";
    header.innerHTML =
      '<div class="section-title"><span>' + section.emoji + '</span><span>' + section.label + '</span></div>' +
      '<div class="badge" id="badge_' + section.id + '">0 / ' + section.items.length + '</div>';
    sec.appendChild(header);

    var wrap = document.createElement("div");
    wrap.className = "section-items";
    wrap.id = "sbar_" + section.id;
    wrap.style.borderLeftColor = section.color + "33";

    section.items.forEach(function(item) {
      var el = document.createElement("div");
      el.className = "check-item";
      el.id = "item_" + item.id;

      var box = document.createElement("div");
      box.className = "checkbox";
      box.innerHTML =
        '<svg width="10" height="8" viewBox="0 0 10 8" fill="none">' +
        '<path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>';

      var textWrap = document.createElement("div");
      var mainText = document.createElement("div");
      mainText.className = "item-text";
      mainText.textContent = item.text;
      textWrap.appendChild(mainText);
      if (item.sub) {
        var sub = document.createElement("div");
        sub.className = "item-sub";
        sub.textContent = item.sub;
        textWrap.appendChild(sub);
      }

      el.appendChild(box);
      el.appendChild(textWrap);
      applyItemState(el, box, item, section);

      el.addEventListener("mouseenter", function() { if (!checks[item.id]) el.style.background = "#f7f6f3"; });
      el.addEventListener("mouseleave", function() { if (!checks[item.id]) el.style.background = ""; });
      el.addEventListener("click", function() {
        checks[item.id] = !checks[item.id];
        applyItemState(el, box, item, section);
        updateSectionBadge(section);
        updateProgress();
        apiSave(item.id, checks[item.id]);
      });

      wrap.appendChild(el);
    });

    sec.appendChild(wrap);
    container.appendChild(sec);
    updateSectionBadge(section);
  });
}

document.getElementById("resetBtn").addEventListener("click", function() {
  if (!confirm("체크를 모두 초기화할까요?")) return;
  apiReset(function() {
    checks = {};
    renderSections();
    updateProgress();
    setStatus("초기화됨", "saved");
    setTimeout(function() { setStatus(""); }, 1500);
  });
});

// ── 초기 로드 ─────────────────────────────────────────
apiLoad(function(data) {
  checks = data;
  renderSections();
  updateProgress();
});
</script>
</body>
</html>
